name: CI - Build, Push and Update Manifests

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Update k8s manifests with new image
        env:
          GITHUB_SHA: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          echo "Updating k8s/deployment.yaml with image ${IMAGE}"
          if [ -f k8s/deployment.yaml ]; then
            sed -i "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/deployment.yaml || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add k8s/deployment.yaml
            git commit -m "ci: update deployment image to ${GITHUB_SHA}" || echo "no changes to commit"
            git push origin HEAD:main || echo "push failed"
          else
            echo "k8s/deployment.yaml not found, skipping manifest update"
          fi
